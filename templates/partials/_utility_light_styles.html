{% load static %}
<style media="not all" data-theme-dark-style>
  /*
    Legacy filename retained for include compatibility.
    Utility pages now use the unified dark platform system.
  */

  body[data-page="friends"],
  body[data-page="notifications"],
  body[data-page="invoice"] {
    background:
      radial-gradient(circle at 14% -6%, rgba(115, 210, 255, 0.15), transparent 30rem),
      radial-gradient(circle at 86% 4%, rgba(244, 201, 93, 0.13), transparent 28rem),
      linear-gradient(135deg, #05070d 0%, #0a1018 100%) !important;
    color: var(--seu-text) !important;
  }

  body[data-page="friends"] .page-bg-overlay,
  body[data-page="notifications"] .page-bg-overlay,
  body[data-page="invoice"] .page-bg-overlay {
    background:
      linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px),
      radial-gradient(circle at 18% 12%, rgba(115, 210, 255, 0.16), transparent 26rem),
      radial-gradient(circle at 86% 6%, rgba(244, 201, 93, 0.14), transparent 24rem),
      linear-gradient(135deg, rgba(5, 7, 13, 0.98), rgba(9, 13, 22, 0.98)) !important;
    background-size: 56px 56px, 56px 56px, auto, auto, auto !important;
  }

  body[data-page="friends"] :is(.card, .friend-card, .friends-card),
  body[data-page="notifications"] :is(.card, .notif-row, .notification-card, .notifications-card),
  body[data-page="invoice"] :is(.invoice-card, .invoice-card [style*="background:#F8FAFC"], .invoice-panel) {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.082), rgba(255, 255, 255, 0.046)) !important;
    border: 1px solid var(--seu-border) !important;
    border-radius: var(--seu-radius-lg) !important;
    box-shadow: var(--seu-shadow-soft) !important;
    color: var(--seu-text) !important;
    backdrop-filter: blur(18px);
  }

  body[data-page="friends"] :is(h1, h2, h3, h4, h5, h6),
  body[data-page="notifications"] :is(h1, h2, h3, h4, h5, h6, .notif-row [style*="color:var(--navy)"]),
  body[data-page="invoice"] :is(h1, h2, h3, h4, h5, h6, strong) {
    color: var(--seu-text) !important;
    -webkit-text-fill-color: currentColor !important;
  }

  body[data-page="friends"] :is(p, small, .text-muted),
  body[data-page="notifications"] :is(p, small, [style*="var(--text-secondary)"], [style*="var(--text-light)"], .text-muted),
  body[data-page="invoice"] :is(p, small, [style*="color:#5A6A7A"], [style*="color:#64748B"], [style*="color:#475569"], .text-muted) {
    color: var(--seu-muted) !important;
  }

  body[data-page="friends"] :is(.btn-primary, .btn-success),
  body[data-page="notifications"] button[type="submit"]:not([title]),
  body[data-page="invoice"] button[onclick="window.print()"] {
    background: linear-gradient(135deg, var(--seu-primary), #ffe18a) !important;
    border-color: rgba(255, 225, 138, 0.45) !important;
    color: #15110a !important;
    box-shadow: 0 14px 30px rgba(244, 201, 93, 0.22) !important;
  }

  body[data-page="friends"] .btn-outline-secondary,
  body[data-page="invoice"] a[href*="profile"],
  body[data-page="notifications"] button[title] {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    color: var(--seu-text) !important;
    border-radius: var(--seu-radius-sm) !important;
  }

  body[data-page="friends"] input,
  body[data-page="notifications"] input,
  body[data-page="invoice"] input {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    color: var(--seu-text) !important;
  }

  body[data-page="notifications"] .notif-row.is-unread {
    border-color: rgba(244, 201, 93, 0.34) !important;
    background: rgba(244, 201, 93, 0.11) !important;
  }

  body[data-page="notifications"] .notif-row:hover {
    background: rgba(255, 255, 255, 0.075) !important;
  }

  body[data-page="invoice"] .invoice-card-header,
  body[data-page="friends"] [style*="background:linear-gradient(135deg,#7B3F00"] {
    background:
      radial-gradient(circle at 16% 12%, rgba(115, 210, 255, 0.16), transparent 22rem),
      radial-gradient(circle at 88% 10%, rgba(244, 201, 93, 0.18), transparent 20rem),
      linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.045)) !important;
    color: var(--seu-text) !important;
  }

  @media print {
    body[data-page="invoice"],
    body[data-page="invoice"] .invoice-card {
      background: #ffffff !important;
      color: #111827 !important;
      box-shadow: none !important;
    }

    body[data-page="invoice"] * {
      color: #111827 !important;
    }
  }
</style>
