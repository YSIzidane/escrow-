{% load site_i18n %}
<div class="card border-0 mb-4 se-share-card">
  <div class="card-body p-4">
    <div class="se-share-head">
      <div>
        <div class="se-share-kicker">{% t "share.kicker" %}</div>
        <h6 class="se-section-mini-title mb-1">
          <i class="fas fa-share-nodes"></i> {% t "share.title" %}
        </h6>
        <p class="se-share-sub mb-0">{% t "share.subtitle" %}</p>
      </div>
    </div>

    <div class="se-share-preview">
      <img src="{{ share_image_url }}" alt="{{ share_title }}" class="se-share-preview-image" loading="lazy" decoding="async" width="184" height="184">
      <div class="se-share-preview-copy">
        <div class="se-share-preview-title">{{ share_title }}</div>
        <div class="se-share-preview-text">{{ share_description }}</div>
      </div>
    </div>

    <div class="se-share-linkbox">
      <input
        type="text"
        value="{{ share_url }}"
        readonly
        class="se-share-link-input"
        aria-label="{% t 'share.copy_link' %}"
        onclick="this.select()"
      >
      <button
        type="button"
        class="se-share-copy-btn"
        onclick="SE.copy('{{ share_url|escapejs }}', '{% t "share.link_copied"|escapejs %}')"
      >
        <i class="fas fa-link"></i> {% t "share.copy_link" %}
      </button>
    </div>

    <div class="se-share-actions">
      <button
        type="button"
        class="se-share-action se-share-native"
        data-share-native
        data-share-title="{{ share_title }}"
        data-share-text="{{ share_description }}"
        data-share-url="{{ share_url }}"
      >
        <i class="fas fa-mobile-screen-button"></i>
        <span>{% t "share.native" %}</span>
      </button>
      <a
        href="https://wa.me/?text={{ share_title|urlencode }}%20{{ share_url|urlencode }}"
        class="se-share-action"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{% t 'share.whatsapp' %}"
      >
        <i class="fab fa-whatsapp"></i>
        <span>{% t "share.whatsapp" %}</span>
      </a>
      <a
        href="https://t.me/share/url?url={{ share_url|urlencode }}&text={{ share_title|urlencode }}"
        class="se-share-action"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{% t 'share.telegram' %}"
      >
        <i class="fab fa-telegram"></i>
        <span>{% t "share.telegram" %}</span>
      </a>
      <a
        href="https://twitter.com/intent/tweet?url={{ share_url|urlencode }}&text={{ share_title|urlencode }}"
        class="se-share-action"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{% t 'share.x' %}"
      >
        <i class="fab fa-x-twitter"></i>
        <span>{% t "share.x" %}</span>
      </a>
      <a
        href="https://www.facebook.com/sharer/sharer.php?u={{ share_url|urlencode }}"
        class="se-share-action"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{% t 'share.facebook' %}"
      >
        <i class="fab fa-facebook-f"></i>
        <span>{% t "share.facebook" %}</span>
      </a>
    </div>
  </div>
</div>

<style>
  .se-section-mini-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--navy);
    margin: 0;
  }
  .se-section-mini-title i {
    color: var(--gold);
  }
  .se-share-card {
    border-radius: 22px !important;
    border: 1px solid rgba(13, 27, 42, 0.08) !important;
    background:
      radial-gradient(circle at top right, rgba(201, 150, 59, 0.12), transparent 34%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 253, 0.98));
    box-shadow: 0 18px 40px rgba(13, 27, 42, 0.08) !important;
  }
  .se-share-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .se-share-kicker {
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 4px;
  }
  .se-share-sub {
    color: var(--text-secondary);
    font-size: 0.84rem;
    line-height: 1.75;
  }
  .se-share-preview {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 12px;
    align-items: center;
    padding: 14px;
    border-radius: 18px;
    background: linear-gradient(135deg, #fbfdff, #f3f7fb);
    border: 1px solid rgba(13, 27, 42, 0.07);
    margin-bottom: 16px;
  }
  .se-share-preview-image {
    width: 92px;
    height: 92px;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid rgba(13, 27, 42, 0.08);
    box-shadow: 0 8px 20px rgba(13, 27, 42, 0.08);
  }
  .se-share-preview-title {
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .se-share-preview-text {
    color: var(--text-secondary);
    font-size: 0.8rem;
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .se-share-linkbox {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  .se-share-link-input {
    flex: 1;
    min-width: 0;
    background: rgba(248, 250, 252, 0.95);
    border: 1px solid rgba(13, 27, 42, 0.08);
    border-radius: 14px;
    padding: 11px 13px;
    font-size: 0.8rem;
    color: var(--navy);
  }
  .se-share-copy-btn,
  .se-share-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    border-radius: 14px;
    border: 1px solid rgba(201, 150, 59, 0.18);
    background: rgba(255, 255, 255, 0.96);
    color: var(--navy);
    font-size: 0.82rem;
    font-weight: 800;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .se-share-copy-btn {
    padding: 0 14px;
    flex-shrink: 0;
  }
  .se-share-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .se-share-action {
    padding: 0 12px;
  }
  .se-share-copy-btn:hover,
  .se-share-action:hover {
    transform: translateY(-1px);
    border-color: rgba(201, 150, 59, 0.34);
    box-shadow: 0 10px 24px rgba(13, 27, 42, 0.08);
    color: var(--navy);
  }
  .se-share-action i,
  .se-share-copy-btn i {
    color: var(--gold-dark);
    font-size: 0.9rem;
  }
  .se-share-native {
    display: none;
  }
  .se-share-native.is-supported {
    display: inline-flex;
  }
  @media (max-width: 991px) {
    .se-share-card {
      border-radius: 18px !important;
    }
  }
  @media (max-width: 576px) {
    .se-share-card .card-body {
      padding: 16px !important;
    }
    .se-share-preview {
      grid-template-columns: 1fr;
      padding: 12px;
    }
    .se-share-preview-image {
      width: 100%;
      height: 160px;
    }
    .se-share-linkbox,
    .se-share-actions {
      grid-template-columns: 1fr;
      display: grid;
    }
  }
</style>
