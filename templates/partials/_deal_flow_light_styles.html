{% load static %}
<style>
  /*
    Legacy filename retained for include compatibility.
    Deal, auction, creation, and checkout flows now inherit the unified dark system.
  */

  body[data-page="deal_detail"],
  body[data-page="deal_auction"],
  body[data-page="create_deal"],
  body[data-page="payment"] {
    background:
      radial-gradient(circle at 16% -4%, rgba(115, 210, 255, 0.15), transparent 30rem),
      radial-gradient(circle at 86% 8%, rgba(244, 201, 93, 0.13), transparent 28rem),
      linear-gradient(135deg, #05070d 0%, #0a1018 100%) !important;
    color: var(--seu-text) !important;
  }

  body[data-page="deal_detail"] .page-bg-overlay,
  body[data-page="deal_auction"] .page-bg-overlay,
  body[data-page="create_deal"] .page-bg-overlay,
  body[data-page="payment"] .page-bg-overlay {
    background:
      linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px),
      radial-gradient(circle at 18% 12%, rgba(115, 210, 255, 0.16), transparent 26rem),
      radial-gradient(circle at 86% 6%, rgba(244, 201, 93, 0.14), transparent 24rem),
      linear-gradient(135deg, rgba(5, 7, 13, 0.98), rgba(9, 13, 22, 0.98)) !important;
    background-size: 56px 56px, 56px 56px, auto, auto, auto !important;
  }

  body[data-page="deal_detail"] :is(.se-gallery-card, .se-product-card, .se-price-card, .se-seller-card, .se-share-card, .se-comments-card, .se-chat-card, .se-detail-card, .se-review-card),
  body[data-page="deal_auction"] :is(.se-auction-card, .se-auction-panel, .se-bid-card, .se-auction-stat),
  body[data-page="create_deal"] :is(.se-form-header, .se-form-card, .se-steps-indicator, .se-cat-card, .se-type-card),
  body[data-page="payment"] :is(.se-payment-hero, .se-step-card, .se-payment-card, .se-payment-summary, .se-method-tab, .se-price-box, .se-transfer-card, .se-ccp-step, .se-total-box) {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.082), rgba(255, 255, 255, 0.046)) !important;
    border: 1px solid var(--seu-border) !important;
    border-radius: var(--seu-radius-lg) !important;
    box-shadow: var(--seu-shadow-soft) !important;
    color: var(--seu-text) !important;
    backdrop-filter: blur(18px);
  }

  body[data-page="deal_detail"] .se-product-top,
  body[data-page="deal_auction"] .se-auction-hero,
  body[data-page="create_deal"] .se-form-card-header,
  body[data-page="payment"] .se-payment-hero,
  body[data-page="payment"] .se-card-head {
    background:
      radial-gradient(circle at 14% 16%, rgba(115, 210, 255, 0.16), transparent 20rem),
      radial-gradient(circle at 86% 8%, rgba(244, 201, 93, 0.18), transparent 18rem),
      linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04)) !important;
    border-color: var(--seu-border) !important;
  }

  body[data-page="deal_detail"] :is(.se-product-title, .se-section-mini-title, .se-product-price),
  body[data-page="deal_auction"] :is(.se-auction-title, .se-auction-section-title, .se-auction-hero-price, .se-auction-stat-value),
  body[data-page="create_deal"] :is(.se-form-title, .se-label, .se-type-title),
  body[data-page="payment"] :is(.se-payment-hero h1, .se-card-head h2, .se-panel-head h3, .se-meta-row strong, .se-total-box strong, .se-payment-overview-item strong) {
    color: var(--seu-text) !important;
    -webkit-text-fill-color: currentColor !important;
  }

  body[data-page="deal_detail"] :is(.se-product-meta, .se-product-desc, .se-product-price-sub),
  body[data-page="deal_auction"] :is(.se-auction-meta, .se-auction-description),
  body[data-page="create_deal"] :is(.se-form-subtitle, .se-type-desc),
  body[data-page="payment"] :is(.se-payment-hero p, .se-panel-head p, .se-meta-row span, .se-quiet-note, .se-field small) {
    color: var(--seu-muted) !important;
  }

  body[data-page="deal_detail"] :is(.se-type-chip-fixed, .se-type-chip-auction),
  body[data-page="deal_auction"] :is(.se-auction-badge-gold, .se-auction-meta-chip),
  body[data-page="create_deal"] .se-step-ind.active .se-step-ind-num,
  body[data-page="payment"] :is(.se-step-number, .se-card-label) {
    background: rgba(244, 201, 93, 0.15) !important;
    border: 1px solid rgba(244, 201, 93, 0.32) !important;
    color: var(--seu-primary) !important;
  }

  body[data-page="create_deal"] :is(.se-input, .se-textarea, input, select, textarea),
  body[data-page="payment"] :is(.se-field input, .se-field textarea, .se-field select, input, select, textarea) {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    border-radius: var(--seu-radius-sm) !important;
    color: var(--seu-text) !important;
    box-shadow: none !important;
  }

  body[data-page="create_deal"] :is(.se-input, .se-textarea, input, select, textarea):focus,
  body[data-page="payment"] :is(.se-field input, .se-field textarea, .se-field select, input, select, textarea):focus {
    border-color: rgba(244, 201, 93, 0.55) !important;
    box-shadow: var(--seu-ring) !important;
    outline: none !important;
  }

  body[data-page="create_deal"] :is(.se-cat-option input:checked + .se-cat-card, .se-type-option input:checked + .se-type-card),
  body[data-page="payment"] .se-method-tab.is-active {
    border-color: rgba(244, 201, 93, 0.55) !important;
    background: rgba(244, 201, 93, 0.12) !important;
    box-shadow: 0 14px 34px rgba(244, 201, 93, 0.14) !important;
  }

  body[data-page="create_deal"] :is(.se-btn-next, .se-btn-submit),
  body[data-page="payment"] :is(.se-primary-btn, .se-success-btn) {
    background: linear-gradient(135deg, var(--seu-primary), #ffe18a) !important;
    border-color: rgba(255, 225, 138, 0.45) !important;
    color: #15110a !important;
    box-shadow: 0 14px 30px rgba(244, 201, 93, 0.22) !important;
  }

  body[data-page="create_deal"] :is(.se-btn-next, .se-btn-submit) *,
  body[data-page="payment"] :is(.se-primary-btn, .se-success-btn) * {
    color: #15110a !important;
  }

  body[data-page="create_deal"] :is(.se-form-icon, .se-step-ind-num),
  body[data-page="payment"] .se-payment-hero-icon {
    background: rgba(244, 201, 93, 0.14) !important;
    border: 1px solid rgba(244, 201, 93, 0.28) !important;
    color: var(--seu-primary) !important;
  }

  body[data-page="deal_detail"] :is(.se-share-preview, .se-share-linkbox, .se-chat-footer, .se-escrow-status, .se-step, .se-info-row),
  body[data-page="deal_auction"] :is(.se-share-preview, .se-bid-row, .se-auction-step) {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    color: var(--seu-text) !important;
  }

  body[data-page="deal_detail"] :is(.se-share-preview-title, .se-comment-author-name, .se-reply-name, .se-seller-name, .se-info-val, .se-escrow-title, .se-step.se-step-active .se-step-label),
  body[data-page="deal_auction"] :is(.se-auction-bidder, .se-auction-label) {
    color: var(--seu-text) !important;
  }

  body[data-page="deal_detail"] :is(.se-share-preview-text, .se-share-sub, .se-comment-text, .se-reply-text, .se-seller-meta),
  body[data-page="deal_auction"] :is(.se-auction-note, .se-auction-meta-text) {
    color: var(--seu-muted) !important;
  }

  body[data-page="deal_detail"] :is(.se-share-link-input, .se-comment-input, .se-chat-input) {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    color: var(--seu-text) !important;
  }

  body[data-page="deal_detail"] :is(.se-share-copy-btn, .se-share-action, .se-deal-attach-btn, .se-chat-send) {
    background: rgba(255, 255, 255, 0.065) !important;
    border: 1px solid var(--seu-border) !important;
    color: var(--seu-text) !important;
  }
</style>
